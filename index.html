<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emily Yu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #12232E;
            --bg-secondary: #203647;
            --text-primary: #e8edf2;
            --text-muted: #8fa3b8;
            --accent: #4da8da;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* --- Loader --- */
        .loader {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .loader.done {
            opacity: 0;
            visibility: hidden;
        }
        .loader-bar {
            width: 48px;
            height: 2px;
            background: var(--text-muted);
            border-radius: 1px;
            position: relative;
            overflow: hidden;
        }
        .loader-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent);
            animation: load 1s ease-in-out infinite;
            transform-origin: left;
        }
        @keyframes load {
            0% { transform: scaleX(0); }
            50% { transform: scaleX(1); transform-origin: left; }
            51% { transform-origin: right; }
            100% { transform: scaleX(0); transform-origin: right; }
        }

        /* --- Main content --- */
        .page {
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 clamp(2rem, 8vw, 10rem);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
        }
        .page.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .content {
            max-width: 560px;
        }

        /* --- Background shape --- */
        .bg-shape {
            position: fixed;
            top: -20%;
            right: -10%;
            width: 60vw;
            height: 140vh;
            background: var(--bg-secondary);
            clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 0% 100%);
            opacity: 0;
            transition: opacity 1.2s ease 0.4s;
        }
        .bg-shape.visible {
            opacity: 1;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: clamp(0.95rem, 1.5vw, 1.1rem);
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            max-width: 440px;
        }

        /* --- Links --- */
        .links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.02em;
            padding: 0.5rem 0;
            position: relative;
            transition: color 0.3s ease;
        }
        .links a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0.25rem;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        .links a:hover {
            color: var(--text-primary);
        }
        .links a:hover::after {
            width: 100%;
        }

        .resume-link {
            margin-top: 2rem;
        }
        .resume-link a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.875rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.02em;
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--accent);
            border-radius: 4px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .resume-link a:hover {
            background: var(--accent);
            color: var(--bg-primary);
        }
        .resume-link a svg {
            width: 14px;
            height: 14px;
        }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            .page {
                padding: 0 1.5rem;
                align-items: flex-end;
                padding-bottom: 4rem;
            }
            .bg-shape {
                width: 80vw;
                right: -20%;
            }
            .links {
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="loader-bar"></div>
    </div>

    <div class="bg-shape" id="bg"></div>

    <main class="page" id="page">
        <div class="content">
            <h1>Emily Yu</h1>
            <p class="tagline">Full-stack developer. Interested in projects that apply programming, software development, and design to meaningful causes.</p>
            <nav class="links">
                <a href="https://github.com/emily-yu">github</a>
                <a href="https://www.linkedin.com/in/emilyyu3/">linkedin</a>
                <a href="mailto:eyudeveloper@gmail.com">email</a>
            </nav>
            <div class="resume-link">
                <a href="EmilyYu_Resume.pdf">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
                    </svg>
                    resume
                </a>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                document.getElementById('loader').classList.add('done');
                document.getElementById('page').classList.add('visible');
                document.getElementById('bg').classList.add('visible');
            }, 800);
        });
    </script>
</body>
</html>
